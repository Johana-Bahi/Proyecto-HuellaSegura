<!DOCTYPE html>
<html lang="es">
<head>

    <title>Editar mascota | Huella Segura NFC</title>
</head>
<body>
    <header>
        <h1>Huella Segura NFC</h1>
    </header>

    <main>
        <h2>Editar mascota</h2>
        <form>
            <label for="nombre">Nombre de la mascota</label>
            <input type="text" id="nombre" name="nombre">

            <label for="especie">Especie</label>
            <input type="text" id="especie" name="especie">

            <label for="raza">Raza</label>
            <input type="text" id="raza" name="raza">

            <label for="color">Color</label>
            <input type="text" id="color" name="color">

            <p>sexo</p>
            <input type="radio" id="macho" name="sexo" value="macho">
            <label for="macho">Macho</label>

            <input type="radio" id="hembra" name="sexo" value="hembra">
            <label for="hembra">Hembra</label>
        </form>

        <footer>
            <p>Huella Segura NFC</p>
        </footer>
        <a href="mascota.html">Volver a la mascota</a>
    </main>
</body>
